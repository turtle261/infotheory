name: Docs

on:
  push:
    branches: ["github"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install VM build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libseccomp-dev clang pkg-config lld
      - name: Build docs
        env:
          RUSTFLAGS: "--cap-lints allow"
          RUSTDOCFLAGS: "--cap-lints allow"
        run: cargo doc --workspace --features vm --no-deps
      - name: Prepare Pages artifact
        run: |
          rm -rf site
          mkdir -p site
          cp -a target/doc/. site/
          touch site/.nojekyll
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=./index.html" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>InfoTheory Docs</title>
            </head>
            <body>
              <p>Redirecting to <a href="./index.html">InfoTheory docs</a>…</p>
            </body>
          </html>
          EOF
          echo "docs.infotheory.dev" > site/CNAME
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
