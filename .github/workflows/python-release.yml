name: Python Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v4

      - name: Validate Linux release cargo env overrides
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: -C target-cpu=generic
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
        run: >-
          cargo check --release --manifest-path infotheory_py/Cargo.toml
          --features python-extension,backend-rosa,backend-mamba,backend-rwkv,backend-zpaq

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: -C target-cpu=generic
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
        with:
          command: build
          args: >-
            --release --interpreter /opt/python/cp310-cp310/bin/python3
            --features python-extension,backend-rosa,backend-mamba,backend-rwkv,backend-zpaq
            --out target/wheels
          manylinux: 2014

      - name: Build wheel (macOS/Windows)
        if: runner.os != 'Linux'
        env:
          RUSTFLAGS: -C target-cpu=generic
        run: uv run maturin build --release --features python-extension,backend-rosa,backend-mamba,backend-rwkv,backend-zpaq --out target/wheels

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: target/wheels/*
          if-no-files-found: error

      - name: Build sdist (Linux only)
        if: runner.os == 'Linux'
        run: uv run maturin sdist

      - name: Upload sdist artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: target/wheels/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - name: Download wheel/sdist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
