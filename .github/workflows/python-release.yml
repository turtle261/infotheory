name: Python Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v4

      - name: Create Python release venv
        shell: bash
        run: |
          uv venv .venv

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld

      - name: Install Python release tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv pip install --python .venv/bin/python "maturin[zig]>=1.7,<2"

      - name: Install Python release tools (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        env:
          VENV_PY: ${{ runner.os == 'Windows' && '.venv/Scripts/python.exe' || '.venv/bin/python' }}
        run: |
          uv pip install --python "$VENV_PY" "maturin>=1.7,<2"

      - name: Validate Linux release cargo env overrides
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: -C target-cpu=x86-64
        run: >-
          cargo check --release --manifest-path infotheory_py/Cargo.toml
          --features python-extension,backend-rosa,backend-mamba,backend-rwkv,backend-zpaq

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CC: clang
          CXX: clang++
          ZPAQ_RS_CXX: clang++
          RUSTFLAGS: -C target-cpu=x86-64
        run: |
          export PATH=".venv/bin:$PATH"
          .venv/bin/python -m maturin build --release \
            --manifest-path infotheory_py/Cargo.toml \
            --interpreter python3 \
            --features python-extension,backend-rosa,backend-mamba,backend-rwkv,backend-zpaq \
            --out target/wheels \
            --compatibility manylinux2014 \
            --zig

      - name: Build wheel (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        env:
          VENV_PY: ${{ runner.os == 'Windows' && '.venv/Scripts/python.exe' || '.venv/bin/python' }}
          RUSTFLAGS: -C target-cpu=generic
        run: |
          export PATH="$(dirname "$VENV_PY"):$PATH"
          "$VENV_PY" -m maturin build --release --manifest-path infotheory_py/Cargo.toml --features python-extension,backend-rosa,backend-mamba,backend-rwkv,backend-zpaq --out target/wheels

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: target/wheels/*
          if-no-files-found: error

      - name: Build sdist (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export PATH=".venv/bin:$PATH"
          .venv/bin/python -m maturin sdist --manifest-path infotheory_py/Cargo.toml

      - name: Upload sdist artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: target/wheels/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - name: Download wheel/sdist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
