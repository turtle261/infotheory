[package]
name = "infotheory"
version = "1.1.0"
edition = "2024"
license = "ISC OR Apache-2.0"
homepage = "https://infotheory.tech"
description = "The algorithmic information theory library."
autobins = false

[workspace]
members = [".", "zpaq_rs", "infotheory_py", "benchman"]
exclude = ["nyx-lite"]
resolver = "3"

[workspace.lints.rust]
warnings = "warn"

[workspace.lints.clippy]
all = "warn"

[dependencies]
zpaq_rs = { version = "1.0.4", optional = true }
nyx-lite = { path = "./nyx-lite", optional = true }
rayon = "1.11.0"
num_cpus = "1.17.0"
once_cell = "1.21.3"
serde_json = "1.0.149"
anyhow = "1.0.100"
ahash = { version = "0.8.12", default-features = false, features = ["std", "no-rng"] }
crc32fast = "1.5.0"
wide = "1.1.1"

[features]
default = ["backend-rosa", "backend-mamba", "backend-rwkv", "backend-zpaq"]
backend-rosa = []
backend-mamba = []
backend-rwkv = []
backend-zpaq = ["dep:zpaq_rs"]
cli = []
vm = ["dep:nyx-lite", "backend-rosa", "backend-mamba", "backend-rwkv", "backend-zpaq"]

[[bin]]
name = "infotheory"
path = "src/main.rs"
required-features = ["cli"]


[[bench]]
name = "par"
harness = false

[[bench]]
name = "aixi"
harness = false

[[bench]]
name = "mixture_backends"
harness = false

[[bench]]
name = "neural_baseline"
harness = false

[[bench]]
name = "simd_hotspots"
harness = false

[[bench]]
name = "rate_backend_coders"
harness = false
required-features = ["backend-rwkv"]

[[bench]]
name = "mamba_rate"
harness = false
required-features = ["backend-mamba"]

[[bench]]
name = "mamba_online_train_full"
harness = false
required-features = ["backend-mamba"]

[[bench]]
name = "rwkv_online_train_full"
harness = false
required-features = ["backend-rwkv"]

[[bench]]
name = "exact_hotpaths"
harness = false
required-features = ["backend-rwkv", "backend-mamba"]

[profile.dev]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.python-release]
inherits = "release"
lto = false

[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
debug = true

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
