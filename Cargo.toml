[workspace]
members = [
    "crates/infotheory",
    "crates/infotheory_py",
    "crates/benchman",
    "vendor/zpaq_rs",
]
default-members = [
    "crates/infotheory",
    "crates/benchman",
    "vendor/zpaq_rs",
]
exclude = ["vendor/nyx-lite"]
resolver = "3"

[workspace.lints.rust]
warnings = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.python-release]
inherits = "release"
lto = false

[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
debug = true
