[package]
name = "infotheory"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://infotheory.tech"

[workspace]
members = [".", "zpaq_rs", "rosa"]
exclude = ["nyx-lite"]
resolver = "3"

[workspace.lints.rust]
warnings = "warn"

[workspace.lints.clippy]
all = "warn"

[dependencies]
zpaq_rs = { path = "./zpaq_rs" }
rosaplus = { path = "./rosa" }
rwkvzip = { path = "./rwkvzip", default-features = false }
nyx-lite = { path = "./nyx-lite", optional = true }
rayon = "1.11.0"
num_cpus = "1.17.0"
once_cell = "1.21.3"
serde_json = "1.0.149"
anyhow = "1.0.100"

[features]
default = []
vm = ["nyx-lite"]


[[bench]]
name = "par"
harness = false

[[bench]]
name = "aixi"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
debug = true
