[package]
name = "infotheory"
version = "1.2.0"
edition = "2024"
license = "ISC OR Apache-2.0"
homepage = "https://infotheory.tech"
description = "The algorithmic information theory library."
autobins = false

[dependencies]
zpaq_rs = { version = "1.0.5", path = "../../vendor/zpaq_rs", optional = true }
nyx-lite = { path = "../../vendor/nyx-lite", optional = true }
gameengine = { version = "0.3.1", path = "../../vendor/gameengine", optional = true, default-features = false }
rayon = "1.11.0"
num_cpus = "1.17.0"
once_cell = "1.21.3"
serde_json = "1.0.149"
anyhow = "1.0.100"
ahash = { version = "0.8.12", default-features = false, features = ["std", "no-rng"] }
crc32fast = "1.5.0"
# Only used by the `aixi` warm-start task fingerprint; gated to keep skinny
# (non-`aixi`) builds free of a digest dependency they cannot use.
sha2 = { version = "0.10", optional = true }
wide = "1.1.1"
libc = { version = "0.2.177", optional = true }

[features]
default = ["default-backends", "aixi"]
# Grouped capability topology.
default-backends = ["capability-default"]
capability-default = [
    "capability-statistical",
    "capability-neural",
    "capability-archive",
]
capability-statistical = [
    "backend-rosa",
    "backend-ctw",
    "backend-match",
    "backend-ppmd",
    "backend-sequitur",
    "backend-mixture",
    "backend-particle",
    "backend-calibrated",
]
capability-neural = [
    "backend-mamba",
    "backend-rwkv",
]
capability-archive = [
    "backend-zpaq",
]
capability-vm = ["aixi-vm"]
aixi = ["dep:sha2"]
tuner = ["aixi", "dep:libc"]
aixi-gameengine = ["aixi", "dep:gameengine", "gameengine/builtin"]
aixi-gameengine-physics = ["aixi-gameengine", "gameengine/physics"]
aixi-vm = ["vm"]

# Legacy compatibility aliases.
all-backends = ["capability-default"]
backend-rosa = []
backend-ctw = []
backend-match = []
backend-ppmd = []
backend-sequitur = []
backend-mixture = []
backend-particle = []
backend-calibrated = []
backend-mamba = []
backend-rwkv = []
backend-zpaq = ["dep:zpaq_rs"]
research-tooling = []
cli = ["aixi"]
vm = ["aixi", "dep:nyx-lite"]

[[bin]]
name = "infotheory"
path = "src/main.rs"
required-features = ["cli"]


[[bench]]
name = "par"
harness = false

[[bench]]
name = "aixi"
harness = false

[[bench]]
name = "aiqi"
harness = false
required-features = ["aixi"]

[[bench]]
name = "mixture_backends"
harness = false

[[bench]]
name = "neural_baseline"
harness = false

[[bench]]
name = "simd_hotspots"
harness = false

[[bench]]
name = "rate_backend_coders"
harness = false
required-features = ["backend-rwkv"]

[[bench]]
name = "mamba_rate"
harness = false
required-features = ["backend-mamba"]

[[bench]]
name = "mamba_online_train_full"
harness = false
required-features = ["backend-mamba"]

[[bench]]
name = "rwkv_online_train_full"
harness = false
required-features = ["backend-rwkv"]

[[bench]]
name = "exact_hotpaths"
harness = false
required-features = ["backend-rwkv", "backend-mamba"]

[[bench]]
name = "compiled_plan_overhead"
harness = false

[[bench]]
name = "mcts_planners"
harness = false
required-features = ["aixi"]

[[bench]]
name = "warmstart"
harness = false
required-features = ["aixi", "backend-ctw"]

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
# Available to feature-light test/bench builds (e.g. `backend-zpaq` without
# `aixi`) where the optional main-crate `sha2` dependency is not enabled.
sha2 = "0.10"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[lints]
workspace = true
