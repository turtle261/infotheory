[package]
name = "infotheory"
version = "1.2.0"
edition = "2024"
license = "ISC OR Apache-2.0"
homepage = "https://infotheory.tech"
description = "The algorithmic information theory library."
autobins = false

[dependencies]
zpaq_rs = { version = "1.0.4", path = "../../vendor/zpaq_rs", optional = true }
nyx-lite = { path = "../../vendor/nyx-lite", optional = true }
rayon = "1.11.0"
num_cpus = "1.17.0"
once_cell = "1.21.3"
serde_json = "1.0.149"
anyhow = "1.0.100"
ahash = { version = "0.8.12", default-features = false, features = ["std", "no-rng"] }
crc32fast = "1.5.0"
wide = "1.1.1"

[features]
default = ["default-backends"]
default-backends = [
    "backend-rosa",
    "backend-ctw",
    "backend-match",
    "backend-ppmd",
    "backend-sequitur",
    "backend-mixture",
    "backend-particle",
    "backend-calibrated",
    "backend-mamba",
    "backend-rwkv",
    "backend-zpaq",
]
all-backends = [
    "backend-rosa",
    "backend-ctw",
    "backend-match",
    "backend-ppmd",
    "backend-sequitur",
    "backend-mixture",
    "backend-particle",
    "backend-calibrated",
    "backend-mamba",
    "backend-rwkv",
    "backend-zpaq",
]
backend-rosa = []
backend-ctw = []
backend-match = []
backend-ppmd = []
backend-sequitur = []
backend-mixture = []
backend-particle = []
backend-calibrated = []
backend-mamba = []
backend-rwkv = []
backend-zpaq = ["dep:zpaq_rs"]
cli = []
vm = ["dep:nyx-lite", "all-backends"]

[[bin]]
name = "infotheory"
path = "src/main.rs"
required-features = ["cli"]


[[bench]]
name = "par"
harness = false

[[bench]]
name = "aixi"
harness = false

[[bench]]
name = "aiqi"
harness = false

[[bench]]
name = "mixture_backends"
harness = false

[[bench]]
name = "neural_baseline"
harness = false

[[bench]]
name = "simd_hotspots"
harness = false

[[bench]]
name = "rate_backend_coders"
harness = false
required-features = ["backend-rwkv"]

[[bench]]
name = "mamba_rate"
harness = false
required-features = ["backend-mamba"]

[[bench]]
name = "mamba_online_train_full"
harness = false
required-features = ["backend-mamba"]

[[bench]]
name = "rwkv_online_train_full"
harness = false
required-features = ["backend-rwkv"]

[[bench]]
name = "exact_hotpaths"
harness = false
required-features = ["backend-rwkv", "backend-mamba"]

[[bench]]
name = "compiled_plan_overhead"
harness = false

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[lints]
workspace = true
