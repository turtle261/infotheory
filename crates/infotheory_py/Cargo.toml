[package]
name = "infotheory_py"
version = "1.1.1"
edition = "2024"
license = "ISC OR Apache-2.0"
description = "PyO3 bindings for infotheory."
homepage = "https://infotheory.tech"
repository = "https://github.com/turtle261/infotheory"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.100"
infotheory = { path = "../infotheory", default-features = false }
pyo3 = { version = "0.28.2", features = ["abi3-py310"] }
rayon = "1.11.0"
serde_json = "1.0.149"

[features]
default = ["default-backends"]
default-backends = [
    "backend-rosa",
    "backend-ctw",
    "backend-match",
    "backend-ppmd",
    "backend-sequitur",
    "backend-mixture",
    "backend-particle",
    "backend-calibrated",
    "backend-mamba",
    "backend-rwkv",
    "backend-zpaq",
]
all-backends = [
    "backend-rosa",
    "backend-ctw",
    "backend-match",
    "backend-ppmd",
    "backend-sequitur",
    "backend-mixture",
    "backend-particle",
    "backend-calibrated",
    "backend-mamba",
    "backend-rwkv",
    "backend-zpaq",
]
python-extension = ["pyo3/extension-module"]
backend-rosa = ["infotheory/backend-rosa"]
backend-ctw = ["infotheory/backend-ctw"]
backend-match = ["infotheory/backend-match"]
backend-ppmd = ["infotheory/backend-ppmd"]
backend-sequitur = ["infotheory/backend-sequitur"]
backend-mixture = ["infotheory/backend-mixture"]
backend-particle = ["infotheory/backend-particle"]
backend-calibrated = ["infotheory/backend-calibrated"]
backend-mamba = ["infotheory/backend-mamba"]
backend-rwkv = ["infotheory/backend-rwkv"]
backend-zpaq = ["infotheory/backend-zpaq"]
vm = ["infotheory/vm"]

[lints]
workspace = true
